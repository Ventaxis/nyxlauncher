[package]
name = "nyxlauncher"
version = "0.3.0"
description = "NyxLauncher — игровой хаб от Ventaxis Corp"
edition = "2021"

[lib]
name = "nyxlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
chrono = "0.4"
