name: Build NyxLauncher

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm ci

      - name: Build
        run: npx tauri build

      - name: Upload raw exe
        uses: actions/upload-artifact@v4
        with:
          name: NyxLauncher-windows-exe
          path: src-tauri/target/release/nyxlauncher.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NyxLauncher-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Release (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/nyxlauncher.exe
